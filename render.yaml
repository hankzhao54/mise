# Render 部署配置 (Blueprint)。在 Render 里 New → Blueprint，选这个仓库即可。
services:
  - type: web
    name: mise
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Budapest
      - key: DATABASE_URL
        sync: false   # Supabase 的 Session pooler 连接串，在 Render 后台填，不写进代码
      # 第一次启动时建管理员账号用 (用户名 mise，密码 = BASIC_PASS)；之后改密码在网页里改
      - key: BASIC_USER
        value: mise
      - key: BASIC_PASS
        sync: false
